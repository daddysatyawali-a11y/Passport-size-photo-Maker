<html lang="en"><head><meta charset="utf-8">

<title>Call Break score pad</title>

<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#0e1726;--mute:#5b6577;--line:#d5dbe5;--acc:#1d4ed8;--onacc:#fff;--win:#0f7a55;--lose:#c62f45;--tint:#e3e9f3;--gold:#d9a400;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0b1320;--panel:#131e30;--ink:#eef2f8;--mute:#93a0b6;--line:#26334a;--acc:#8fb0ff;--onacc:#0b1320;--win:#3ddc97;--lose:#ff7088;--tint:#1b2a43;--gold:#f5c542}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "DM Sans","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;min-height:44px;padding:0 14px;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 132px}
.serif{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:700;font-variant-numeric:lining-nums}
h1{font-size:50px;line-height:1.02;margin:22px 0 8px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 26px}
.lab{font-weight:600;margin:0 0 8px;display:block}
.stp{display:inline-flex;align-items:center;gap:6px;background:var(--tint);border-radius:14px;padding:4px}
.stp button{width:44px;padding:0;font-size:22px;border:0;background:var(--panel)}
.stp .bid{min-width:44px;text-align:center;font-size:30px;line-height:1}
.field{margin-bottom:20px}
.sw{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--panel);border:1.5px solid var(--line);margin-bottom:18px;font-weight:600}
.sw input{width:22px;height:22px;accent-color:var(--acc)}
.sw small{display:block;font-weight:400;color:var(--mute)}
.names{display:grid;gap:8px;margin-bottom:20px}
.nrow{display:grid;grid-template-columns:1fr;gap:8px}
.nrow.sc{grid-template-columns:1fr 104px}
.names input,.field input{width:100%;min-height:48px;padding:0 14px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px}
.hd{display:grid;grid-template-columns:1fr 104px;gap:8px;font-size:13px;color:var(--mute);margin-bottom:-2px}
.cta{width:100%;min-height:56px;font-size:18px;background:var(--ink);color:var(--bg);border-color:var(--ink);border-radius:14px}
.bar{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 16px}
.bar h2{margin:0;font-size:40px;line-height:1;letter-spacing:-.02em}
.bar small{display:block;color:var(--mute);margin-top:4px}
.rows{display:grid;gap:10px;position:relative}
.row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:10px 10px 10px 12px}
.row.won{border-color:var(--win);box-shadow:inset 4px 0 0 var(--win)}
.row.lost{border-color:var(--lose);box-shadow:inset 4px 0 0 var(--lose)}
.g1,.hl1{--hc:#d9a400}.g2,.hl2{--hc:#9aa5b8}.g3,.hl3{--hc:#c07a3a}
.row.hl1,.row.hl2,.row.hl3{border-color:var(--hc);background:linear-gradient(100deg,color-mix(in srgb,var(--hc) 24%,var(--panel)),var(--panel) 75%);box-shadow:0 0 0 2px color-mix(in srgb,var(--hc) 30%,transparent),0 6px 20px color-mix(in srgb,var(--hc) 24%,transparent)}
.rk.g1,.rk.g2,.rk.g3,.hl1 .rk,.hl2 .rk,.hl3 .rk{background:var(--hc);color:#231a00}
.row.won{border-color:var(--win);box-shadow:inset 4px 0 0 var(--win)}
.row.lost{border-color:var(--lose);box-shadow:inset 4px 0 0 var(--lose)}
.row.rise{animation:rise 1.8s ease-out}
.row.fall{animation:fall 1.8s ease-out}
@keyframes rise{0%,35%{box-shadow:0 0 0 3px var(--win),0 8px 24px color-mix(in srgb,var(--win) 45%,transparent)}100%{}}
@keyframes fall{0%,35%{box-shadow:0 0 0 3px var(--lose),0 8px 24px color-mix(in srgb,var(--lose) 40%,transparent)}100%{}}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.rk{flex:none;width:26px;height:26px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:13px;font-weight:700}
.nl{display:flex;align-items:center;gap:6px;min-width:0}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crown{font-size:15px;animation:wob 2.4s ease-in-out infinite}

.tot .d{font-family:"DM Sans",system-ui,sans-serif;font-size:15px;font-weight:700;margin-left:6px}
.pos{color:var(--win)}.neg{color:var(--lose)}
.row .stp{flex:none}
.res{display:flex;align-items:center;gap:8px;flex:none}
.res .bid{font-size:30px;min-width:30px;text-align:center}
.seg{display:flex;border-radius:12px;overflow:hidden;border:1.5px solid var(--line)}
.seg button{border:0;border-radius:0;min-height:44px;padding:0 12px;background:var(--panel)}
.seg .w.on{background:var(--win);color:#fff}
.seg .lo.on{background:var(--lose);color:#fff}
.mode button{flex:1}
.mode .on{background:var(--acc);color:var(--onacc)}
.dock{flex:none;padding-top:10px}
.dock>div{display:grid;grid-template-columns:auto 1fr;gap:10px}
.dock .cta{grid-column:1/-1}
.dock.two .cta{grid-column:auto}

.sheet .wrap{padding-bottom:32px}
.hit{z-index:25}
.hit .wrap{text-align:center;padding-top:36px}
.hit h2{font-size:38px;line-height:1.1;margin:6px 0 6px;letter-spacing:-.02em}
.hit .sub{margin-bottom:22px}
.hit input{text-align:center;font-size:22px;font-weight:700}
.hit button+button,.hit input+button{margin-top:8px;width:100%}
.hit .err{color:var(--lose);font-size:14px;margin:6px 0 0}
.trophy{font-size:72px;line-height:1;animation:bounce 1.2s cubic-bezier(.3,1.5,.5,1)}
@keyframes bounce{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.shead h2{margin:0;font-size:34px;line-height:1.05;letter-spacing:-.02em}
.win-box{background:var(--ink);color:var(--bg);border-radius:16px;padding:16px 18px;margin-bottom:18px}
.win-box .serif{font-size:34px;line-height:1.1}
.win-box div+div{opacity:.75;margin-top:4px}
h3{margin:22px 0 8px;font-size:15px}
.tbl{flex:1;min-height:0;overflow:auto;background:var(--panel);border:1.5px solid var(--line);border-radius:14px}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line);font-weight:600}
th{position:sticky;top:0;z-index:2;background:var(--panel);color:var(--mute)}
tr:last-child td{border-bottom:0}
.sc{position:sticky;left:0;z-index:1;background:var(--panel);text-align:left;min-width:200px;border-right:1px solid var(--line)}
th.sc{z-index:3}
.pc,.fc{display:flex;align-items:center;gap:8px}
.pi{min-width:0;flex:1}.pn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ps{font-size:12px;color:var(--mute);font-weight:400}.pt{font-size:22px;flex:none}
.note{color:var(--mute);font-size:13px;margin:8px 2px 0}
.acts{display:grid;gap:10px;margin:22px 0 8px}
.warn{color:var(--lose);border-color:var(--lose)}
.empty{color:var(--mute);padding:14px}
a.cta{display:grid;place-items:center;text-decoration:none;font-weight:700;border-radius:14px;border:2px solid var(--ink);background:var(--ink);color:var(--bg)}
.shot{width:100%;height:auto;border-radius:14px;border:1.5px solid var(--line);margin-bottom:12px}
body{position:relative}
#app{position:relative;z-index:1}
#cf{position:fixed;inset:0;z-index:60;pointer-events:none}
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;will-change:transform}
.blobs i:nth-child(1){width:62vmax;height:62vmax;left:-18vmax;top:-20vmax;background:#6d8dff;animation:b1 24s ease-in-out infinite alternate}
.blobs i:nth-child(2){width:54vmax;height:54vmax;right:-20vmax;top:18%;background:#c58bff;animation:b2 30s ease-in-out infinite alternate}
.blobs i:nth-child(3){width:58vmax;height:58vmax;left:-8vmax;bottom:-24vmax;background:#3ddcc0;animation:b3 27s ease-in-out infinite alternate}
.blobs i:nth-child(4){width:40vmax;height:40vmax;right:5vmax;bottom:-8vmax;background:#ff9bb0;animation:b1 21s ease-in-out infinite alternate-reverse}
@keyframes b1{to{transform:translate(22vmax,16vmax) scale(1.2)}}
@keyframes b2{to{transform:translate(-26vmax,-10vmax) scale(.85)}}
@keyframes b3{to{transform:translate(24vmax,-18vmax) scale(1.15)}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .blobs i{opacity:.33}}
:root[data-theme="dark"] .blobs i{opacity:.33}
.game{height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;padding:10px 16px 12px}
.game .bar{flex:none;margin:0 0 10px}.game .bar h2{font-size:32px}
.game .rows{flex:1;min-height:0;align-content:start;overflow-y:auto;padding:3px}
.row{background:color-mix(in srgb,var(--panel) 80%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.med{font-size:15px}
.rows.cp{gap:6px}.cp .row{padding:3px 8px}.cp .who>div{display:flex;align-items:center;gap:10px}.cp .tot{font-size:20px}
.cp .stp button,.cp .seg button{min-height:34px;width:auto;min-width:34px;font-size:18px}.cp .seg button{font-size:14px;padding:0 9px}.cp .stp .bid,.cp .res .bid{font-size:22px;min-width:28px}
.stw,.fw{height:100%;display:flex;flex-direction:column;padding-bottom:14px}
.stw .shead{flex:none}.shead h2{font-size:28px}.shead small{color:var(--mute);font-size:13px}
.ib{display:flex;gap:8px}.ibtn{width:44px;padding:0}
.ibtn,.fi button{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.acts2{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stw .note{flex:none}
.fin{z-index:26}.fw{text-align:center;padding-top:18px}
.ft{flex:none}.ft .trophy{font-size:52px}.ft h2{font-size:32px;margin:2px 0;line-height:1.1}.ft .sub{margin:0 0 12px}
.fl{flex:1;min-height:0;display:grid;gap:8px;align-content:start;overflow-y:auto;padding:4px;text-align:left}
.fc{padding:10px 12px;border-radius:16px;background:var(--panel);border:1.5px solid var(--line);animation:cardIn .65s cubic-bezier(.3,1.4,.5,1) both}
.fc.g1,.fc.g2,.fc.g3{border-color:var(--hc);background:linear-gradient(100deg,color-mix(in srgb,var(--hc) 24%,var(--panel)),var(--panel) 75%);box-shadow:0 6px 20px color-mix(in srgb,var(--hc) 24%,transparent)}
.fl.cp{gap:6px}.fl.cp .fc{padding:6px 10px}.fl.cp .pt{font-size:19px}
.fa{flex:none;padding-top:12px;animation:cardIn .5s ease both}
.fi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.nf{animation:none!important}
@keyframes cardIn{from{opacity:0;transform:translateY(36px) scale(.92)}to{opacity:1;transform:none}}
.mod{position:fixed;inset:0;z-index:40;background:rgba(5,10,20,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fadeIn .2s}
.mod .card{width:100%;max-width:360px;background:var(--panel);border:1.5px solid var(--line);border-radius:20px;padding:20px;animation:cardIn .3s cubic-bezier(.3,1.4,.5,1)}
.mod button{width:100%;margin-top:8px}.mod small{display:block;font-weight:400;opacity:.8}.mod .cta{min-height:52px;font-size:16px}
@keyframes fadeIn{from{opacity:0}}
button{transition:transform .12s,background .2s,border-color .2s,box-shadow .2s}
button:active:not(:disabled){transform:scale(.96)}
@media (hover:hover){button:hover:not(:disabled){border-color:var(--acc)}}
h1{background:linear-gradient(120deg,var(--ink) 30%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.cta{box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 22%,transparent)}
.names input,.field input,.sw,.stp{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.names input,.field input,.sw{background:color-mix(in srgb,var(--panel) 78%,transparent)}
.tbl{overflow-x:hidden;overflow-y:auto;background:color-mix(in srgb,var(--panel) 85%,transparent)}
table.v{table-layout:fixed;width:100%;min-width:0}
table.v th,table.v td{padding:7px 2px;background:transparent}
table.v th{background:var(--panel)}
table.v .rc{width:46px;color:var(--mute);font-size:12px}
table.v tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--tint) 40%,transparent)}
.ph{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;padding:0 2px}
.ph .rk{width:22px;height:22px;font-size:11px;margin-bottom:2px}
.ph .pn{font-size:12px;max-width:100%}.ph .pt{font-size:20px;line-height:1.15}.ph .ps{font-size:11px;font-weight:600}
.cm{flex:none;display:flex;align-items:flex-start;gap:10px;margin-top:10px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--panel) 72%,transparent);border:1.5px solid var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:13.5px;line-height:1.4;min-height:68px}
.cm p{margin:0;flex:1;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cm .mic{font-size:18px;line-height:1.2}.cm.off p{color:var(--mute)}.cm.new{animation:cardIn .5s cubic-bezier(.3,1.4,.5,1)}
.chip{min-height:28px;padding:0 10px;font-size:12px;border-radius:99px;flex:none}
.fq{margin:0 0 10px;text-align:left;min-height:0}
@media (prefers-reduced-motion:reduce){.row.rise,.row.fall,.crown,.mv,.trophy,.blobs i,.fc,.fa,.mod,.mod .card{animation:none}}
</style></head>
<body><div class="blobs" aria-hidden="true"><i></i><i></i><i></i><i></i></div><canvas id="cf"></canvas><div id="app"></div>
<script>
const K='callbreak-scorepad-v1';
const fresh=()=>({view:'setup',names:[],start:[],offset:0,rounds:[],bids:[],phase:'bid',res:[],sheet:false,final:false,finale:false,lang:'en',endCm:null,mode:'endless',target:31,hit:false,mv:{}});
let S=fresh();
let setup={lang:'en',n:4,names:[],prog:false,starts:[],offset:'',mode:'target',target:'31'};
let stScroll=false,cmNew=false,menu=false,fin=false,fdone=false,shot=null,flip=false,nt='',ntErr='';
function save(){try{localStorage.setItem(K,JSON.stringify({S,setup}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(K)||'null');if(d&&d.S&&Array.isArray(d.S.names)){S=Object.assign(S,d.S);setup=Object.assign(setup,d.setup||{})}}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sg=n=>n>0?'+'+n:n<0?'\u2212'+Math.abs(n):'0';
const cls=n=>n<0?'neg':'';
const base=i=>(S.start&&S.start[i])||0;
const total=i=>S.rounds.reduce((a,r)=>a+(r.res[i]?r.bids[i]:-r.bids[i]),base(i));
function stat(i){const rs=S.rounds;const w=rs.filter(r=>r.res[i]).length;const l=rs.length-w;
return{w,l,avg:rs.length?rs.reduce((a,r)=>a+r.bids[i],0)/rs.length:0,pct:rs.length?Math.round(100*w/rs.length):0}}
function ranking(){const o=S.names.map((_,i)=>i).sort((a,b)=>total(b)-total(a));const rank={};
o.forEach((i,k)=>{rank[i]=(k>0&&total(i)===total(o[k-1]))?rank[o[k-1]]:k+1});return{o,rank}}
let ac;function A(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function tone(f,d,t,v,w,sl){const c=A();if(!c)return;try{const o=c.createOscillator(),g=c.createGain(),s=c.currentTime+(w||0);o.type=t||'sine';o.frequency.setValueAtTime(f,s);if(sl)o.frequency.exponentialRampToValueAtTime(sl,s+d);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.2,s+.015);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.03)}catch(e){}}
const snd={tick:()=>tone(900,.05,'sine',.08),lock:()=>{tone(196,.2,'triangle',.3);tone(392,.3,'sine',.18,.09);tone(587,.45,'sine',.14,.2)},win:()=>[523,659,784,1047].forEach((f,k)=>tone(f,.3,'triangle',.2,k*.08)),lose:()=>{tone(311,.5,'sawtooth',.08,0,155);tone(233,.6,'triangle',.18,.14,110)},save:()=>{tone(660,.12,'sine',.15);tone(990,.22,'sine',.12,.09)},end:()=>[523,659,784,1047,1319].forEach((f,k)=>tone(f,.5,'triangle',.18,k*.12)),swoosh:()=>tone(260,.5,'sine',.1,.1,1100)};
const hap=p=>{if(navigator.vibrate)try{navigator.vibrate(p)}catch(e){}};
function draw(){const {o,rank}=ranking(),n=o.length,W=1080,H=470+n*148+110,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
const rr=(a,b,w,h,q)=>{x.beginPath();if(x.roundRect)x.roundRect(a,b,w,h,q);else x.rect(a,b,w,h)};
x.fillStyle='#0b1320';x.fillRect(0,0,W,H);x.fillStyle='#8fb0ff';x.font='700 84px Georgia,serif';x.fillText('Call Break',70,150);
const played=S.offset+S.rounds.length,tied=o.filter(i=>total(i)===total(o[0]));
x.fillStyle='#93a0b6';x.font='500 36px system-ui,sans-serif';x.fillText(played+' round'+(played===1?'':'s')+' played',70,210);
x.fillStyle='#eef2f8';x.font='700 60px Georgia,serif';let t=tied.map(i=>S.names[i]).join(' & ')+(tied.length>1?' tie':' wins');
while(x.measureText(t).width>940&&t.length>4)t=t.slice(0,-2);x.fillText(t,70,330);
x.fillStyle='#8fb0ff';x.font='600 40px system-ui,sans-serif';x.fillText('with '+total(o[0])+' points',70,392);
o.forEach((i,k)=>{const y=450+k*148;x.fillStyle='#131e30';rr(60,y,960,128,28);x.fill();x.fillStyle='#1b2a43';x.beginPath();x.arc(140,y+64,32,0,7);x.fill();
x.fillStyle='#eef2f8';x.font='700 34px system-ui,sans-serif';x.textAlign='center';x.fillText(rank[i],140,y+76);

const body=(hasStart?`<tr><td class="rc">Start</td>${o.map(i=>`<td class="${cls(base(i))}">${base(i)}</td>`).join('')}</tr>`:'')+S.rounds.map((r,k)=>`<tr><td class="rc">R${S.offset+k+1}</td>${o.map(i=>`<td class="${r.res[i]?'pos':'neg'}">${sg(r.res[i]?r.bids[i]:-r.bids[i])}</td>`).join('')}</tr>`).join('');
const note=S.rounds.length?'% under each name is the win rate'+(hasStart?' (only rounds entered here).':'.'):'No rounds saved yet.';
return `<div class="sheet"><div class="wrap stw"><div class="shead"><div><h2 class="serif">${S.final?'Final summary':'Statistics'}</h2><small>${sub}</small></div><div class="ib"><button class="ibtn" data-a="share" aria-label="Share result" title="Share result">${IC.share}</button><button class="ibtn" data-a="img" aria-label="Save as image" title="Save as image">${IC.img}</button><button class="ibtn" data-a="close" aria-label="Close" title="Close">${IC.x}</button></div></div>
<div class="tbl"><table class="v"><thead>${head}</thead><tbody>${body}</tbody></table></div>${note?`<p class="note">${note}</p>`:''}
<div class="acts2">${S.final?'<button data-a="resume">Keep playing</button>':`<button data-a="undo" ${S.rounds.length?'':'disabled'}>Undo last round</button>`}<button class="warn" data-a="menu">End / New game</button></div></div></div>`}
function finale(){const {o,rank}=ranking();const tied=o.filter(i=>total(i)===total(o[0])),n=o.length,nf=fdone?' nf':'';
return `<div class="sheet fin"><div class="wrap fw"><div class="ft"><div class="trophy${nf}">\uD83C\uDFC6</div><h2 class="serif">Final standings</h2><p class="sub">${tied.map(i=>esc(S.names[i])).join(' & ')} ${tied.length>1?'tie':'wins'} with ${total(o[0])}</p></div>
<div class="fl${n>=6?' cp':''}">${o.map((i,k)=>{const s=stat(i),g=rank[i]<=3?' g'+rank[i]:'';return `<div class="fc${g}${nf}" data-p="${i}" style="animation-delay:${(1+k*.85).toFixed(2)}s"><span class="rk${g}">${rank[i]}</span><div class="pi"><div class="pn">${esc(S.names[i])}${rank[i]===1?' \uD83D\uDC51':''}</div><div class="ps">${s.w}\u2013${s.l} \u00B7 ${s.pct}% wins</div></div><b class="pt serif ${cls(total(i))}">${total(i)}</b></div>`}).join('')}</div>
<div class="fa${nf}" style="animation-delay:${(1.2+n*.85).toFixed(2)}s">${cmBox(S.endCm,true)}<button class="cta" data-a="showsum">Show summary</button><div class="fi"><button data-a="share">${IC.share} Share</button><button data-a="img">${IC.img} Save image</button></div></div></div></div>`}
function modal(){if(!menu)return'';return `<div class="mod" data-a="menuclose"><div class="card" role="dialog" aria-modal="true" aria-label="End or new game"><h3 class="serif" style="font-size:24px;margin:0 0 4px">Finish up?</h3><p class="note" style="margin:0 0 10px">Choose what happens to this game.</p>${S.final?'<button class="cta" data-a="resume">Keep playing</button>':'<button class="cta" data-a="end">End game &amp; see results</button>'}<button class="warn" data-a="newgo">Start a new game<small>Erases all rounds and scores</small></button><button data-a="menuclose">Cancel</button></div></div>`}
const COL=['#f5c542','#8fb0ff','#ff7088','#3ddc97','#c9a0ff','#ffffff','#ff9f43'];let P=[],raf=0;const cv=document.getElementById('cf');
function conf(x,y,n,ang,spr,pw){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
for(let k=0;k<n;k++){const a=ang+(Math.random()-.5)*spr,v=pw*(.4+Math.random()*.7);P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*6,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:COL[k%COL.length],l:0})}
if(!raf)raf=requestAnimationFrame(tick)}
function tick(){if(cv.width!==innerWidth||cv.height!==innerHeight){cv.width=innerWidth;cv.height=innerHeight}
const g=cv.getContext('2d');g.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.y<cv.height+20&&p.l<260);
for(const p of P){p.vx*=.985;p.vy=p.vy*.985+.28;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l++;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.globalAlpha=Math.min(1,(260-p.l)/60);g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()}
raf=P.length?requestAnimationFrame(tick):0}
function startFinale(){fdone=false;const {o}=ranking(),W=innerWidth,H=innerHeight;
conf(0,H*.7,70,-1,.7,17);conf(W,H*.7,70,-Math.PI+1,.7,17);setTimeout(()=>{if(S.finale)conf(W/2,H*.3,90,-Math.PI/2,Math.PI*1.2,12)},350);
o.forEach((i,k)=>setTimeout(()=>{if(!S.finale)return;const e=document.querySelector('.fc[data-p="'+i+'"]');if(!e)return;const r=e.getBoundingClientRect();conf(r.left+r.width/2,r.top+r.height/2,k===0?80:40,-Math.PI/2,Math.PI*1.4,k===0?11:8);k===0?snd.end():snd.save()},1150+k*850));
setTimeout(()=>{fdone=true},(1.8+o.length*.85)*1000)}
function setupView(){const n=setup.n,p=setup.prog,m=setup.mode,l=setup.lang||'en';
return `<main class="wrap" style="padding-bottom:32px"><h1 class="serif">Call Break</h1><p class="sub">Score pad for any number of players.</p>
<div class="field"><span class="lab">Players</span><div class="stp"><button data-a="n-" aria-label="Fewer players">\u2212</button><span class="bid serif">${n}</span><button data-a="n+" aria-label="More players">+</button></div></div>
<div class="field"><span class="lab">Game length</span><div class="seg mode"><button class="${m==='target'?'on':''}" data-a="mt">Target score</button><button class="${m==='endless'?'on':''}" data-a="me">Endless</button></div>
${m==='target'?`<div style="margin-top:10px"><label class="lab" for="tg">Winning score</label><input id="tg" data-tg type="number" min="1" step="1" placeholder="31" value="${esc(setup.target)}"></div><p class="note">The first player to reach it is declared the winner. You can then end the game, set a higher target, or go endless.</p>`:'<p class="note">Play as long as you like. End the game any time from Stats.</p>'}</div>
<div class="field"><span class="lab">Commentary</span><div class="seg mode"><button class="${l==='en'?'on':''}" data-a="sl-en">English</button><button class="${l==='hi'?'on':''}" data-a="sl-hi">हिन्दी</button><button class="${l==='off'?'on':''}" data-a="sl-off">Off</button></div><p class="note">A voice after every round: kind to winners, merciless to losers.</p></div>
<label class="sw"><input type="checkbox" data-sw ${p?'checked':''}><span>Game already in progress<small>Enter the scores so far and carry on from there</small></span></label>
${p?'<div class="hd"><span>Name</span><span>Score so far</span></div>':''}
<div class="names">${Array.from({length:n},(_,i)=>`<div class="nrow${p?' sc':''}"><input data-name="${i}" maxlength="16" placeholder="Player ${i+1}" value="${esc(setup.names[i]||'')}" aria-label="Player ${i+1} name">${p?`<input data-score="${i}" type="number" step="1" placeholder="0" value="${esc(setup.starts[i]??'')}" aria-label="Player ${i+1} score so far">`:''}</div>`).join('')}</div>
${p?`<div class="field"><label class="lab" for="off">Rounds already played</label><input id="off" data-off type="number" min="0" step="1" placeholder="0" value="${esc(setup.offset)}"></div>`:''}
<button class="cta" data-a="start">${p?'Continue game':'Start game'}</button></main>`}
const cap=()=>{const m={};document.querySelectorAll('.row[data-p]').forEach(e=>m[e.dataset.p]=e.getBoundingClientRect().top);return m};
function anim(old){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;let moved=false;
document.querySelectorAll('.row[data-p]').forEach((e,k)=>{const o=old[e.dataset.p];if(o===undefined)return;const dy=o-e.getBoundingClientRect().top;if(Math.abs(dy)<8)return;moved=true;const up=dy>0;
e.style.zIndex=up?6:1;
const a=e.animate([{transform:`translateY(${dy}px) scale(1)`},{transform:`translateY(${dy*.45}px) scale(${up?1.05:.96})`,offset:.4},{transform:'translateY(0) scale(1)'}],{duration:950,delay:k*70,easing:'cubic-bezier(.22,.9,.28,1)',fill:'backwards'});
e.classList.add(up?'rise':'fall');a.onfinish=()=>{e.style.zIndex=''};setTimeout(()=>e.classList.remove('rise','fall'),2400)});
if(moved)snd.swoosh()}
function render(){const old=flip?cap():null;flip=false;
document.getElementById('app').innerHTML=(S.view==='setup'?setupView():game())+(S.view==='game'&&S.sheet?sheet():'')+(S.view==='game'?hitView():'')+(S.view==='game'&&S.finale?finale():'')+modal()+overlay();
cmNew=false;if(stScroll){stScroll=false;const t=document.querySelector('.tbl');if(t)t.scrollTop=t.scrollHeight}if(old)anim(old);save()}
function checkHit(){if(S.view!=='game'||S.final||S.hit||S.mode!=='target'||!S.rounds.length)return;
const {o}=ranking();if(total(o[0])>=S.target){S.hit=true;nt='';ntErr='';snd.end();hap([60,40,60,40,140]);render()}}
function act(a,i){
if(a==='n-'&&setup.n>2)setup.n--;
else if(a==='n+'&&setup.n<8)setup.n++;
else if(a==='mt')setup.mode='target';
else if(a==='me')setup.mode='endless';
else if(a.startsWith('sl-'))setup.lang=a.slice(3);
else if(a==='lang')S.lang=({en:'hi',hi:'off',off:'en'})[S.lang||'en'];
else if(a==='start'){const n=setup.n,p=setup.prog;
S=Object.assign(fresh(),{view:'game',names:Array.from({length:n},(_,k)=>(setup.names[k]||'').trim()||'Player '+(k+1)),
start:Array.from({length:n},(_,k)=>p?(parseInt(setup.starts[k],10)||0):0),offset:p?Math.max(0,parseInt(setup.offset,10)||0):0,
bids:Array(n).fill(1),res:Array(n).fill(null),
mode:setup.mode,lang:setup.lang||'en',target:Math.max(1,parseInt(setup.target,10)||31)})}
else if(a==='inc'&&S.bids[i]<13){S.bids[i]++;snd.tick();hap(10)}
else if(a==='dec'&&S.bids[i]>0){S.bids[i]--;snd.tick();hap(10)}
else if(a==='lock'){S.phase='result';S.res=S.names.map(()=>null);S.mv={};snd.lock();hap([30,40,30])}
else if(a==='unlock'){S.phase='bid';S.res=S.names.map(()=>null)}
else if(a==='win'){if(S.res[i]!==true){snd.win();hap(25)}S.res[i]=true}
else if(a==='lose'){if(S.res[i]!==false){snd.lose();hap([50,40,50])}S.res[i]=false}
else if(a==='saveRound'&&S.res.every(x=>x!==null)){const before=ranking().rank;
const pl=ranking().o[0];S.rounds.push({bids:S.bids.slice(),res:S.res.slice()});S.rounds[S.rounds.length-1].cm=comment(pl);cmNew=true;S.bids=S.names.map(()=>1);S.res=S.names.map(()=>null);S.phase='bid';
const after=ranking().rank;S.mv={};S.names.forEach((_,k)=>{S.mv[k]=before[k]-after[k]});
flip=true;snd.save();hap(30);setTimeout(checkHit,1600)}
else if(a==='stats'){stScroll=true;S.sheet=true;S.final=false;menu=false}
else if(a==='close'){S.sheet=false;S.final=false;menu=false}
else if(a==='menu'){menu=true}
else if(a==='menuclose'){menu=false}
else if(a==='showsum'){stScroll=true;S.finale=false;S.sheet=true}
else if(a==='undo'){stScroll=true;S.rounds.pop();S.mv={};S.hit=false;flip=true}
else if(a==='end'){menu=false;S.final=true;S.sheet=false;S.finale=true;fin=true;S.endCm=endLine();hap([60,40,60,40,140])}
else if(a==='resume'){menu=false;S.final=false;S.finale=false;S.sheet=false;if(S.mode==='target'&&S.rounds.length){const {o}=ranking();if(total(o[0])>=S.target){S.hit=true;nt='';ntErr=''}}}
else if(a==='hitEnd'){S.hit=false;S.final=true;S.sheet=false;S.finale=true;fin=true;S.endCm=endLine();hap([60,40,60,40,140])}
else if(a==='hitSet'){const {o}=ranking(),top=total(o[0]);const def=Math.ceil((top+10)/10)*10;const v=parseInt(nt!==''?nt:def,10);
if(!(v>top)){ntErr='Enter a score higher than '+top+'.'}else{S.target=v;S.hit=false;ntErr='';nt='';snd.save()}}
else if(a==='hitInf'){S.mode='endless';S.hit=false;ntErr='';nt='';snd.save()}
else if(a==='share'){share();return}
else if(a==='img'){shot=draw().toDataURL('image/png')}
else if(a==='shotclose'){shot=null}
else if(a==='newgo'){menu=false;S=fresh()}
render();if(fin){fin=false;startFinale()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&(b.tagName==='BUTTON'||e.target===b)){A();act(b.dataset.a,+b.dataset.i)}});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset||{};
if(d.name!==undefined)setup.names[+d.name]=t.value;
else if(d.score!==undefined)setup.starts[+d.score]=t.value;
else if(d.off!==undefined)setup.offset=t.value;
else if(d.tg!==undefined)setup.target=t.value;
else if(d.nt!==undefined)nt=t.value;
save()});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.sw!==undefined){setup.prog=e.target.checked;render()}});
load();menu=false;render();if(S.view==='game'&&S.finale)startFinale();
</script></body></html>
